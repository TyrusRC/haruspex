[project]
name = "haruspex"
version = "0.2.0"
description = "A small, local, calibrated decision layer for security operations — reuses GLiNER2.5-Decide, adds typed boolean/choice/score verdicts and selective (abstaining) calibration."
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Tyrus"}]
keywords = ["decision-model", "calibration", "selective-prediction", "gliner2", "security", "pentest", "soc"]

dependencies = [
    # GLiNER2.5-Decide runs through gliner2 (pulls torch + transformers).
    "gliner2>=2.1",
]

[project.optional-dependencies]
serve = ["starlette>=0.37", "uvicorn>=0.29"]
train = ["gliner2[train]>=2.1", "peft>=0.11"]       # LoRA / full fine-tune
data = ["datasets>=2.19", "huggingface_hub>=0.23"]  # pull public decision datasets
distill = ["httpx>=0.27"]                           # optional: label rows from an OpenAI-compatible model

[project.scripts]
haruspex-train = "haruspex.train:main"
haruspex-eval = "haruspex.eval:main"
haruspex-serve = "haruspex.serve:main"
haruspex-calibrate = "haruspex.calibrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haruspex"]
