[project]
name = "haruspex"
version = "0.1.0"
description = "A small open-weight decision model — reads the signs, returns calibrated verdicts. Per-candidate scoring on a ModernBERT encoder; typed Choice/Noul/Score with calibrated probabilities."
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Tyrus"}]
keywords = ["decision-model", "calibration", "jev", "security", "classification", "reranking"]

dependencies = [
    # ModernBERT needs a recent transformers; torch provides CPU/CUDA/MPS.
    "torch>=2.3",
    "transformers>=4.48",
    "safetensors>=0.4",
    "numpy>=1.26",
    "scikit-learn>=1.4",   # isotonic calibration (train-time)
]

[project.optional-dependencies]
serve = ["starlette>=0.37", "uvicorn>=0.29"]
train4b = ["peft>=0.11"]                       # LoRA for the Qwen3.5-4B leaderboard variant
data = ["datasets>=2.19", "huggingface_hub>=0.23"]   # pull public decision datasets
distill = ["httpx>=0.27"]                      # optional: label rows from an OpenAI-compatible model

[project.scripts]
haruspex-train = "haruspex.train:main"
haruspex-eval = "haruspex.eval:main"
haruspex-serve = "haruspex.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haruspex"]
